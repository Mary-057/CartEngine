<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout Error - CartEngine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <div class="max-w-md mx-auto px-4 py-24 text-center">
        <div class="bg-white p-8 rounded-2xl shadow-sm ring-1 ring-slate-900/5">
            <h1 class="text-xl font-bold text-red-600 mb-2">Checkout Error</h1>
            <p class="text-slate-500 text-sm mb-6">Something went wrong while processing your checkout. Please try again.</p>
            <a href="{% url 'cart_detail' %}" class="inline-block rounded-lg bg-[#DAA520] px-6 py-3 text-sm font-semibold text-slate-900 hover:bg-[#B8860B] transition-all">
                Back to Cart
            </a>
        </div>
    </div>
</body>
</html>
