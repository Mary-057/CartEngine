<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout Error</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased flex items-center justify-center min-h-screen">
    <div class="max-w-md mx-auto px-4 text-center bg-white p-8 rounded-2xl shadow-sm ring-1 ring-slate-900/5">
        <div class="h-12 w-12 rounded-full bg-red-50 flex items-center justify-center text-red-600 font-bold text-xl mx-auto mb-4">
            !
        </div>
        <h1 class="text-xl font-bold text-slate-900 mb-2">Something Went Wrong</h1>
        <p class="text-sm text-slate-500 mb-6">We encountered an unexpected error while preparing your checkout. Please try again or contact support.</p>
        <a href="/cart/" class="inline-block rounded-lg bg-slate-900 px-6 py-3 text-sm font-semibold text-white shadow-sm hover:bg-slate-800 transition-all">
            Return to Cart
        </a>
    </div>
</body>
</html>
